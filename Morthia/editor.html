<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morthia — Map Editor</title>

  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Metamorphous&family=Overlock&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <link rel="stylesheet" href="./editor.css" />
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:12px;">
    <a href="index.html" style="text-decoration:none;">
      <div class="header-title" style="cursor:pointer;">
        Morthia <span>/ Map Editor</span>
      </div>
    </a>
    <div class="mode-indicator" id="modeIndicator">VIEW MODE</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-secondary" id="loadJsonBtn">Load places.json</button>
    <input type="file" id="fileInput" accept=".json" style="display:none" />
    <button class="btn btn-success" id="exportBtn">⬇ Export places.json</button>
  </div>
</header>

<div class="workspace">
  <div class="sidebar">
    <div class="sidebar-tabs">
      <button class="tab active" data-tab="edit">✏ Edit / Add</button>
      <button class="tab" data-tab="list">☰ All Places</button>
    </div>

    <div class="tab-panel active" id="tab-edit">
      <div class="draw-hint">
        <strong>1.</strong> Draw a polygon on the map.<br>
        <strong>2.</strong> Fill details and save.
      </div>

      <div class="form-panel">
        <div class="form-section-title">
          Region Shape
          <button class="btn btn-secondary" id="redrawBtn" style="font-size:0.72rem;">
            ✏ Redraw Shape
          </button> 
        </div>

        <div class="polygon-status no-polygon" id="polygonStatus">
          No polygon drawn yet — use the draw tool.
        </div>

        <div style="display:flex; gap:8px; margin-bottom:16px;">
          <button class="btn btn-secondary" id="clearPolygonBtn" style="flex:1; font-size:0.72rem;">✕ Clear Shape</button>
        </div>

        <div class="form-section-title">Place Details</div>

        <div class="form-group">
          <label>Name *</label>
          <input type="text" id="fieldName" />
        </div>

        <div class="form-group">
          <label>Type</label>
          <select id="fieldType">
            <option value="">— Select —</option>
            <option>City/Settlement</option>
            <option>Forest</option>
            <option>Mountain</option>
            <option>Lake</option>
            <option>Ocean/Water</option>
            <option>Shores/Coasts</option>
            <option>Point of Interest</option>
            <option>Mine</option>
            <option>Waterfall</option>
            <option>Desert</option>
            <option>Region</option>
          </select>
        </div>

        <div class="form-group">
          <label>Kingdom / Region</label>
          <input type="text" id="fieldRegion" list="regionList" />
          <datalist id="regionList"></datalist>
        </div>

        <div class="form-group">
          <label>Leader</label>
          <input type="text" id="fieldLeader" />
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea id="fieldDescription"></textarea>
        </div>

        <div class="form-group">
          <label>Alias</label>
          <input type="text" id="fieldAlias" />
        </div>
      </div>

      <div class="form-actions">
        <button class="btn btn-primary" id="saveBtn">Save Place</button>
        <button class="btn btn-secondary" id="clearFormBtn">Clear</button>
      </div>
    </div>

    <div class="tab-panel" id="tab-list">
      <input type="text" id="searchInput" placeholder="Search..." />
      <div id="listCount"></div>
      <div id="placesList"></div>
    </div>
  </div>

  <div id="map"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<script>
const MAP_HEIGHT = 6144;
const MAP_WIDTH  = 8192;
const IMG_PATH   = '../images/Morthia-Web-Official.jpg';

let placesData = {};
let editingKey = null;
let drawnPolygon = null;
let allLayers = {};
let redrawMode = false;
let startPointMarker = null;

const map = L.map('map', { crs: L.CRS.Simple });
const bounds = [[0,0],[MAP_HEIGHT, MAP_WIDTH]];
L.imageOverlay(IMG_PATH, bounds).addTo(map);
map.fitBounds(bounds);

const drawnItems = new L.FeatureGroup().addTo(map);

map.addControl(new L.Control.Draw({
  edit: { featureGroup: drawnItems },
  draw: { polygon: true, rectangle: true, marker: false, polyline:false, circle:false }
}));

// ⭐ START POINT MARKER
function updateStartPointMarker(latlng) {
  if (startPointMarker) map.removeLayer(startPointMarker);
  if (!latlng) return;

  startPointMarker = L.circleMarker(latlng, {
    radius: 6,
    color: '#00e5ff',
    fillColor: '#00e5ff',
    fillOpacity: 1
  }).addTo(map).bindTooltip('Start', { permanent:true, offset:[0,-10] });
}

// ⭐ LIVE DRAW TRACKING
map.on('draw:drawvertex', (e) => {
  const layers = e.layers.getLayers();
  if (!layers.length) return;

  const latlngs = layers[0].getLatLngs();
  if (latlngs.length) updateStartPointMarker(latlngs[0]);
});

// ⭐ DRAW COMPLETE
map.on(L.Draw.Event.CREATED, (e) => {
  drawnPolygon = e.layer;
  drawnItems.addLayer(drawnPolygon);

  const pts = drawnPolygon.getLatLngs()[0];
  if (pts.length) updateStartPointMarker(pts[0]);

  redrawMode = false;
});

// ⭐ REDRAW BUTTON
document.getElementById('redrawBtn').onclick = () => {
  if (!editingKey) return alert('Select a place first');
  redrawMode = true;
  if (drawnPolygon) drawnItems.removeLayer(drawnPolygon);
  drawnPolygon = null;
  if (startPointMarker) map.removeLayer(startPointMarker);
};

// ⭐ LOAD PLACE
function loadPlaceForEditing(key){
  editingKey = key;
  const info = placesData[key];

  if (drawnPolygon) drawnItems.removeLayer(drawnPolygon);

  drawnPolygon = L.polygon(info.coords).addTo(drawnItems);

  if (info.coords.length){
    updateStartPointMarker(L.latLng(info.coords[0][0], info.coords[0][1]));
  }
}

// ⭐ SAVE
document.getElementById('saveBtn').onclick = () => {
  const name = fieldName.value.trim();
  if (!name || !drawnPolygon) return alert('Missing data');

  const coords = drawnPolygon.getLatLngs()[0].map(p=>[p.lat,p.lng]);

  const key = editingKey || name;
  placesData[key] = { place:name, coords };

  alert('Saved!');
};

// ⭐ AUTO LOAD
fetch('../places.json')
.then(r=>r.json())
.then(data=>{
  placesData = data;
  Object.entries(data).forEach(([k,v])=>{
    const layer = L.polygon(v.coords).addTo(map);
    layer.on('click', ()=>loadPlaceForEditing(k));
  });
});
</script>
</body>
</html>
